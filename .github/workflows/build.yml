name: Build Jarvis

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ---------- Автотести на справжньому Windows: вікна, буфер, реєстр, Edge, голос, YouTube Music
  tests:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest
      - name: Core + Windows tests
        shell: pwsh
        run: |
          python -m pytest -v -rA -m "not network" --junitxml=test-core.xml 2>&1 | Tee-Object -FilePath test-core.txt
          exit $LASTEXITCODE
      - name: Network tests (YouTube Music, edge-tts, weather)
        if: always()
        shell: pwsh
        run: |
          python -m pytest -v -rA -m network --junitxml=test-network.xml 2>&1 | Tee-Object -FilePath test-network.txt
          exit $LASTEXITCODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: test-*.*
      # Звіт тестів у гілку ci-results — його можна прочитати через GitHub API (для діагностики)
      - name: Publish test report to ci-results branch
        if: always()
        shell: bash
        run: |
          mkdir -p /tmp/rep && cp test-*.txt /tmp/rep/ 2>/dev/null || true
          git config user.name "jarvis-ci"; git config user.email "ci@users.noreply.github.com"
          git checkout --orphan ci-results
          git rm -rfq . >/dev/null 2>&1 || true
          cp /tmp/rep/* . 2>/dev/null || true
          echo "${{ github.sha }}" > commit.txt
          git add -A && git commit -qm "test report ${{ github.sha }}" && git push -f origin ci-results

  # ---------- Збірка: папка (швидкий старт) + інсталятор + портативний zip
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller
      - name: Check sources
        run: python -m compileall -q main.py core
      - name: Version
        id: ver
        shell: pwsh
        run: |
          $v = python tools/version.py
          "version=$v" >> $env:GITHUB_OUTPUT
      - name: Build info (для самооновлення)
        shell: pwsh
        run: |
          @{ repo = "${{ github.repository }}"; version = "${{ steps.ver.outputs.version }}"; commit = "${{ github.sha }}" } |
            ConvertTo-Json | Set-Content -Encoding utf8 assets\build_info.json
      - name: Build (PyInstaller, onedir)
        run: >
          pyinstaller --noconfirm --clean --onedir --windowed
          --name Jarvis
          --icon assets/icon.ico
          --add-data "ui;ui"
          --add-data "assets;assets"
          --collect-all speech_recognition
          --collect-all edge_tts
          --collect-binaries onnxruntime
          --collect-all playwright
          --collect-data tzdata
          --hidden-import pyaudio
          --hidden-import clr
          --hidden-import icalendar
          --hidden-import recurring_ical_events
          --hidden-import onnxruntime
          main.py
      - name: Self-test the built exe
        shell: pwsh
        run: |
          $p = Start-Process -FilePath "dist\Jarvis\Jarvis.exe" -ArgumentList "--selftest" -Wait -PassThru
          Get-Content "$env:TEMP\jarvis_selftest.txt"
          Get-Content "$env:TEMP\jarvis_selftest.txt" | ForEach-Object { Write-Output "::notice title=selftest::$_" } | Select-Object -First 9
          if ($p.ExitCode -ne 0) { Write-Error "Self-test failed (exit $($p.ExitCode))"; exit 1 }
      - name: Installer (Inno Setup)
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress; $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" }
          & $iscc "/DAppVersion=${{ steps.ver.outputs.version }}" installer.iss
          Compress-Archive -Path dist\Jarvis -DestinationPath dist\Jarvis-portable.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Jarvis-${{ steps.ver.outputs.version }}
          path: |
            dist/Jarvis-Setup.exe
            dist/Jarvis-portable.zip
      - name: Publish release (on tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/Jarvis-Setup.exe
            dist/Jarvis-portable.zip
